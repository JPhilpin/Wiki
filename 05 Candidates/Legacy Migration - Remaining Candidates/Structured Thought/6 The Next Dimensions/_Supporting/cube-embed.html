<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Responsive Sliding Cube</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    #canvasContainer {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
        "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.32.2/+esm",
        "tween": "https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.5.0/dist/tween.esm.js"
      }
    }
  </script>
</head>

<body>
  <div id="canvasContainer"></div>
    
  

<script type="module">
  import * as THREE from "three";
  import { EffectComposer, RenderPass, EffectPass, BloomEffect, FXAAEffect } from "postprocessing";
  import TWEEN from "tween";

  const container = document.getElementById("canvasContainer");

  /* -----------------------------
     Scene & Camera
  ----------------------------- */

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  camera.position.z = 7;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  /* -----------------------------
     Lighting
  ----------------------------- */

  const light1 = new THREE.DirectionalLight(0xffffff, 1.4);
  light1.position.set(5, 5, 5);
  scene.add(light1);

  const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
  light2.position.set(-5, -5, -5);
  scene.add(light2);

  /* -----------------------------
     Cube Structure (Rubik-style)
  ----------------------------- */

  const outerWrapper = new THREE.Object3D();   // rotates constantly
  const innerWrapper = new THREE.Object3D();   // slice rotations happen here
  outerWrapper.add(innerWrapper);
  scene.add(outerWrapper);

  const slices = []; // three layer groups

  function buildCube() {
    const size = 3;
    const offset = (size - 1) / 2;

    const material = new THREE.MeshStandardMaterial({
      color: 0x000000,
      metalness: 1,
      roughness: 0.02
    });

    // create 3 slices (one per X layer)
    for (let i = 0; i < size; i++) {
      const slice = new THREE.Object3D();
      slices.push(slice);
      innerWrapper.add(slice);

      for (let j = 0; j < size; j++) {
        for (let k = 0; k < size; k++) {
          const geom = new THREE.BoxGeometry(1, 1, 1);
          const cube = new THREE.Mesh(geom, material);

          cube.position.set(
            (i - offset) * 1.05,
            (j - offset) * 1.05,
            (k - offset) * 1.05
          );

          slice.add(cube);
        }
      }
    }
  }

  buildCube();

  /* -----------------------------
     Bloom & Composer
  ----------------------------- */

  const bloom = new BloomEffect({
    intensity: 1.15,
    luminanceThreshold: 0.82,
    luminanceSmoothing: 0.6,
    radius: 0.14
  });

  const fxaa = new FXAAEffect();

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new EffectPass(camera, fxaa, bloom));

  /* -----------------------------
     Responsive Resize
  ----------------------------- */

  function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;

    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    renderer.setSize(w, h);
    composer.setSize(w, h);
  }

  requestAnimationFrame(resize);
  window.addEventListener("resize", resize);

  /* -----------------------------
     Slice Rotation Logic (A)
     – one axis (x or z)
     – clean 90° turn
     – single slice at a time
  ----------------------------- */

  function rotateRandomSlice() {
    const slice = slices[Math.floor(Math.random() * 3)];
    const axis = Math.random() > 0.5 ? "x" : "z";

    const duration = 900;
    const start = { angle: 0 };
    const end = { angle: Math.PI / 2 };

    new TWEEN.Tween(start)
      .to(end, duration)
      .easing(TWEEN.Easing.Quadratic.Out)
      .onUpdate(() => {
        slice.rotation[axis] = start.angle;
      })
      .onComplete(() => {
        // ensure perfect alignment
        slice.rotation[axis] = Math.PI / 2;
        // next twist after a short pause
        setTimeout(rotateRandomSlice, 600 + Math.random() * 500);
      })
      .start();
  }

  rotateRandomSlice();

  /* -----------------------------
     Animation Loop
  ----------------------------- */

  function animate() {
    requestAnimationFrame(animate);

    // slow global rotation
    outerWrapper.rotation.x += 0.0035;
    outerWrapper.rotation.y += 0.0045;

    TWEEN.update();
    composer.render();
  }

  animate();
</script>
</body>
</html>
