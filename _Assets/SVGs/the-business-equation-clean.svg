<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Business Equation: People, Money and Things flow through Production, Market, Commerce and Organisation to create Value, moving from Systems of Record and PESC toward Systems of Engagement and CEDN">
  <!-- Outer ring: Systems of Engagement / Systems of Record -->
  <circle cx="450" cy="300" r="185" fill="#E6F1FB" stroke="#125993" stroke-width="1.5"/>
  <!-- Middle ring: Production / Commerce -->
  <circle cx="450" cy="300" r="125" fill="#C3DEF5" stroke="#125993" stroke-width="1.5"/>
  <!-- Inner circle: The Business Equation itself -->
  <circle cx="450" cy="300" r="65" fill="#FFFFFF" stroke="#242943" stroke-width="2"/>

  <!-- GROWTH / COMPLIANCE banners -->
  <rect x="360" y="60" width="180" height="30" rx="4" fill="#125993"/>
  <text x="450" y="80" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">GROWTH</text>
  <rect x="360" y="510" width="180" height="30" rx="4" fill="#125993"/>
  <text x="450" y="530" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">COMPLIANCE</text>

  <!-- Systems of Engagement / Record -->
  <text x="450" y="150" font-family="system-ui, sans-serif" font-size="16" fill="#3a4a58" text-anchor="middle">Systems of Engagement</text>
  <text x="450" y="460" font-family="system-ui, sans-serif" font-size="16" fill="#3a4a58" text-anchor="middle">Systems of Record</text>

  <!-- Production / Commerce -->
  <text x="450" y="215" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a2733" text-anchor="middle">Production</text>
  <text x="450" y="400" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a2733" text-anchor="middle">Commerce</text>

  <!-- The Business Equation title + Market/Organisation -->
  <text x="450" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#125993" text-anchor="middle">Market</text>
  <text x="450" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#242943" text-anchor="middle">The Business</text>
  <text x="450" y="312" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#242943" text-anchor="middle">Equation</text>
  <text x="450" y="335" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#125993" text-anchor="middle">Organisation</text>

  <!-- OFFER / VALUE vertical bars -->
  <rect x="248" y="255" width="26" height="90" rx="4" fill="#125993"/>
  <text x="261" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 261 300)">OFFER</text>
  <rect x="626" y="255" width="26" height="90" rx="4" fill="#125993"/>
  <text x="639" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 639 300)">VALUE</text>

  <!-- People Money Things (left) -->
  <rect x="20" y="255" width="150" height="90" fill="#161616"/>
  <text x="95" y="280" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">People</text>
  <text x="95" y="302" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Money</text>
  <text x="95" y="324" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Things</text>

  <!-- The Shift Enabled (right) -->
  <rect x="730" y="255" width="150" height="90" fill="#161616"/>
  <text x="805" y="280" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">The</text>
  <text x="805" y="302" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Shift</text>
  <text x="805" y="324" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enabled</text>

  <!-- Connecting arrows across the middle -->
  <path d="M 170 300 L 245 300" stroke="#242943" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 652 300 L 727 300" stroke="#242943" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#242943"/>
    </marker>
  </defs>

  <!-- PESC (bottom-left, feeding Systems of Record) -->
  <rect x="215" y="430" width="80" height="34" rx="6" fill="#7a8f99"/>
  <text x="255" y="452" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">PESC</text>
  <text x="130" y="500" font-family="system-ui, sans-serif" font-size="12" fill="#3a4a58">Producer Efficient</text>
  <text x="130" y="516" font-family="system-ui, sans-serif" font-size="12" fill="#3a4a58">Supply Chains</text>
  <path d="M 295 447 L 340 425" stroke="#7a8f99" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- CEDN (top-right, fed by Systems of Engagement) -->
  <rect x="605" y="136" width="80" height="34" rx="6" fill="#7a8f99"/>
  <text x="645" y="158" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">CEDN</text>
  <text x="700" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#3a4a58">Customer Effective</text>
  <text x="700" y="126" font-family="system-ui, sans-serif" font-size="12" fill="#3a4a58">Demand Networks</text>
  <path d="M 605 153 L 560 175" stroke="#7a8f99" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <defs>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8f99"/>
    </marker>
  </defs>
</svg>
