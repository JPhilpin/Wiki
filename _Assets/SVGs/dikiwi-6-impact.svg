<circle cx="95" cy="82" r="2" fill="none" stroke="#F0F0F0" stroke-width="0.5"/>
<circle cx="42" cy="125" r="2" fill="none" stroke="#F0F0F0" stroke-width="0.5"/>

<!-- THE JUMP — concentric circles centred slightly right -->
