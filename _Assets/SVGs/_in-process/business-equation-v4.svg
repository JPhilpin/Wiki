<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The Business Equation: four overlapping systems - Engagement (growth), Record (compliance), Production and Commerce - around the Business Equation of Market and Organisation. People, Money and Things enter as the Offer and leave as Value, the Shift Enabled, as power moves from Producer Efficient Supply Chains to Customer Effective Demand Networks." xmlns:c2pa="http://c2pa.org/manifest">
  <title>The Business Equation</title>
  <defs>
    <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#7F95A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="headb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#24518A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <radialGradient id="core" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#3F72A6"/><stop offset="1" stop-color="#24518A"/></radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#FBFAF7"/>

  <!-- Four systems -->
  <g fill="#3D6E9E" fill-opacity="0.16" stroke="#3D6E9E" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="960" cy="368" r="325"/>
    <circle cx="960" cy="712" r="325"/>
    <circle cx="785" cy="540" r="325"/>
    <circle cx="1135" cy="540" r="325"/>
  </g>

  <!-- Flow: offer in, value out -->
  <path d="M300 540H478" stroke="#7F95A8" stroke-width="2" marker-end="url(#head)"/>
  <path d="M1442 540H1618" stroke="#7F95A8" stroke-width="2" marker-end="url(#head)"/>

  <!-- PESC to CEDN -->
  <path d="M540 812 L 1378 268" stroke="#7F95A8" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M1540 175 L 1596 140" stroke="#7F95A8" stroke-width="2" marker-end="url(#head)"/>

  <!-- The Business Equation -->
  <circle cx="960" cy="540" r="170" fill="url(#core)" stroke="#16365E" stroke-width="3"/>
  <text x="960" y="520" text-anchor="middle" font-size="30" font-weight="600" fill="#FFFFFF">The Business</text>
  <text x="960" y="560" text-anchor="middle" font-size="30" font-weight="600" fill="#FFFFFF">Equation</text>

  <!-- Inner labels -->
  <g font-size="20" font-weight="700" letter-spacing="1" text-anchor="middle">
    <rect x="884" y="384" width="152" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="960" y="411" fill="#24518A">Market</text>
    <rect x="862" y="656" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="960" y="683" fill="#24518A">Organisation</text>
    <rect x="634" y="520" width="176" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="722" y="547" fill="#24518A">Production</text>
    <rect x="1110" y="520" width="176" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="1198" y="547" fill="#24518A">Commerce</text>
  </g>

  <!-- Systems labels -->
  <g text-anchor="middle" font-size="34" font-weight="400" fill="#3A4A58" letter-spacing="1">
    <text x="960" y="196">Systems of</text>
    <text x="960" y="240" font-weight="600">Engagement</text>
    <text x="960" y="852">Systems of</text>
    <text x="960" y="896" font-weight="600">Record</text>
  </g>

  <!-- Growth / Compliance -->
  <rect x="800" y="64" width="320" height="50" rx="6" fill="#24518A"/>
  <text x="960" y="100" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="8" fill="#FFFFFF">GROWTH</text>
  <rect x="800" y="966" width="320" height="50" rx="6" fill="#24518A"/>
  <text x="960" y="1002" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="8" fill="#FFFFFF">COMPLIANCE</text>

  <!-- Offer / Value -->
  <rect x="484" y="380" width="50" height="320" rx="6" fill="#24518A"/>
  <text x="509" y="540" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="8" fill="#FFFFFF" transform="rotate(-90 509 540)" dy="9">OFFER</text>
  <rect x="1386" y="380" width="50" height="320" rx="6" fill="#24518A"/>
  <text x="1411" y="540" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="8" fill="#FFFFFF" transform="rotate(90 1411 540)" dy="9">VALUE</text>

  <!-- People Money Things -->
  <rect x="94" y="380" width="200" height="320" rx="10" fill="#16161A"/>
  <g text-anchor="middle" font-size="32" font-weight="600" fill="#FFFFFF">
    <text x="194" y="480">People</text>
    <text x="194" y="552">Money</text>
    <text x="194" y="624">Things</text>
  </g>

  <!-- The Shift Enabled -->
  <rect x="1626" y="380" width="200" height="320" rx="10" fill="#16161A"/>
  <g text-anchor="middle" font-size="32" font-weight="600" fill="#FFFFFF">
    <text x="1726" y="480">The</text>
    <text x="1726" y="552">Shift</text>
    <text x="1726" y="624" font-style="italic" font-weight="500">Enabled</text>
  </g>

  <!-- PESC -->
  <rect x="384" y="800" width="150" height="124" rx="16" fill="#7E8F99"/>
  <text x="459" y="874" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="10" fill="#FFFFFF" dx="5">PESC</text>
  <g font-size="28" fill="#5F6B75" text-anchor="end">
    <text x="300" y="800"><tspan font-weight="700" fill="#24518A">P</tspan>roducer</text>
    <text x="300" y="844"><tspan font-weight="700" fill="#24518A">E</tspan>fficient</text>
    <text x="300" y="888"><tspan font-weight="700" fill="#24518A">S</tspan>upply</text>
    <text x="300" y="932"><tspan font-weight="700" fill="#24518A">C</tspan>hains</text>
  </g>

  <!-- CEDN -->
  <rect x="1386" y="155" width="150" height="124" rx="16" fill="#7E8F99"/>
  <text x="1461" y="229" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="10" fill="#FFFFFF" dx="5">CEDN</text>
  <g font-size="28" fill="#5F6B75">
    <text x="1636" y="150"><tspan font-weight="700" fill="#24518A">C</tspan>ustomer</text>
    <text x="1636" y="194"><tspan font-weight="700" fill="#24518A">E</tspan>ffective</text>
    <text x="1636" y="238"><tspan font-weight="700" fill="#24518A">D</tspan>emand</text>
    <text x="1636" y="282"><tspan font-weight="700" fill="#24518A">N</tspan>etworks</text>
  </g>

  <!-- PHI⑊PIN -->
  <rect x="1626" y="966" width="200" height="50" fill="#000000"/>
  <text x="1636" y="1003" font-family="Menlo, Courier New, monospace" font-size="32" font-weight="700" fill="#FFFFFF">PHI</text>
  <line x1="1712" y1="966" x2="1736" y2="1016" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1742" y="1003" font-family="Menlo, Courier New, monospace" font-size="32" font-weight="700" fill="#FFFFFF">PIN</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
