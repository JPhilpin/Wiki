<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The Business Equation: People, Money and Things become an Offer; Production, Market, Organisation and Commerce turn it into Value, the shift enabled. Systems of Engagement drive growth, Systems of Record carry compliance, as power moves from Producer Efficient Supply Chains to Customer Effective Demand Networks." xmlns:c2pa="http://c2pa.org/manifest">
  <title>The Business Equation</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5F5E5A" stroke-width="0.6" opacity="0.08"/></pattern>
    <clipPath id="top"><rect x="0" y="0" width="1200" height="380"/></clipPath>
    <clipPath id="bot"><rect x="0" y="380" width="1200" height="380"/></clipPath>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F7A8A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="1200" height="760" fill="#FBFAF7"/>
  <rect width="1200" height="760" fill="url(#grid)"/>

  <!-- Growth / Compliance -->
  <text x="600" y="92" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="4" fill="#D85A30">GROWTH</text>
  <path d="M600 104V122" stroke="#D85A30" stroke-width="1.4" marker-end="url(#a-warm)" transform="rotate(180 600 113)"/>
  <text x="600" y="684" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="4" fill="#5F7A8A">COMPLIANCE</text>
  <path d="M600 640V658" stroke="#5F7A8A" stroke-width="1.4" marker-end="url(#a-cool)"/>

  <!-- Outer ring: engagement above, record below -->
  <g clip-path="url(#top)"><circle cx="600" cy="380" r="250" fill="#FAECE7"/><circle cx="600" cy="380" r="170" fill="#F7D9CC"/></g>
  <g clip-path="url(#bot)"><circle cx="600" cy="380" r="250" fill="#E6EEF2"/><circle cx="600" cy="380" r="170" fill="#D3E0E7"/></g>
  <circle cx="600" cy="380" r="250" fill="none" stroke="#888780" stroke-width="1.2"/>
  <circle cx="600" cy="380" r="170" fill="none" stroke="#888780" stroke-width="1"/>

  <!-- Ground line -->
  <path d="M350 380H512M688 380H850" stroke="#2C2C2A" stroke-width="1" stroke-dasharray="3 5" opacity="0.45"/>

  <!-- Ring labels -->
  <text x="600" y="176" text-anchor="middle" font-size="19" font-weight="500" letter-spacing="0.5" fill="#993C1D">Systems of Engagement</text>
  <text x="600" y="256" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="1" fill="#712B13">Production</text>
  <text x="600" y="516" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="1" fill="#2E4553">Commerce</text>
  <text x="600" y="598" text-anchor="middle" font-size="19" font-weight="500" letter-spacing="0.5" fill="#3E5563">Systems of Record</text>

  <!-- Core -->
  <circle cx="600" cy="380" r="88" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.6"/>
  <text x="600" y="348" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2" fill="#D85A30">MARKET</text>
  <text x="600" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2C2A">The Business</text>
  <text x="600" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2C2A">Equation</text>
  <text x="600" y="425" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2" fill="#5F7A8A">ORGANISATION</text>

  <!-- In: People, Money, Things -->
  <rect x="60" y="306" width="200" height="148" rx="14" fill="#2C2C2A"/>
  <text x="160" y="346" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">People</text>
  <line x1="100" y1="361" x2="220" y2="361" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="160" y="388" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Money</text>
  <line x1="100" y1="403" x2="220" y2="403" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="160" y="430" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Things</text>

  <path d="M262 380H346" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="304" y="366" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#2C2C2A">OFFER</text>

  <!-- Out: The Shift Enabled -->
  <path d="M854 380H938" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="896" y="366" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#2C2C2A">VALUE</text>
  <rect x="940" y="306" width="200" height="148" rx="14" fill="#D85A30"/>
  <text x="1040" y="372" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">The Shift</text>
  <text x="1040" y="402" text-anchor="middle" font-size="19" font-weight="500" font-style="italic" fill="#FFFFFF">Enabled</text>

  <!-- PESC: feeds systems of record -->
  <rect x="120" y="598" width="96" height="36" rx="18" fill="#5F7A8A"/>
  <text x="168" y="621" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">PESC</text>
  <text x="120" y="660" font-size="13" fill="#5F5E5A">Producer Efficient</text>
  <text x="120" y="677" font-size="13" fill="#5F5E5A">Supply Chains</text>
  <path d="M216 610 L 418 560" stroke="#5F7A8A" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a-cool)"/>

  <!-- CEDN: fed by systems of engagement -->
  <rect x="984" y="126" width="96" height="36" rx="18" fill="#D85A30"/>
  <text x="1032" y="149" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">CEDN</text>
  <text x="984" y="96" font-size="13" fill="#5F5E5A">Customer Effective</text>
  <text x="984" y="113" font-size="13" fill="#5F5E5A">Demand Networks</text>
  <path d="M984 150 L 784 202" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a-warm)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
