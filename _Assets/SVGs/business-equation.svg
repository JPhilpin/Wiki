<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1618" height="1000" viewBox="0 0 1618 1000" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The Business Equation: people, money and things go in as the offer, the business works on them, value comes out. The weight is shifting from systems of record and producer efficient supply chains, bottom left, to systems of engagement and customer effective demand networks, top right.">
