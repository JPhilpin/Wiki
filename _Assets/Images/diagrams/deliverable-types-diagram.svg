<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five deliverable types that always sit inside a Domain: Advisory, Consulting, Product, License, Enablement">
  <rect x="40" y="40" width="600" height="124" rx="20" fill="#E6F1FB" stroke="#125993" stroke-width="1.5"/>
  <text x="60" y="66" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#125993">Domain</text>
  <text x="60" y="84" font-family="system-ui, sans-serif" font-size="12" fill="#5a6b78">e.g. Reveal, Pulse, Intelligence&#8230;</text>

  <g>
    <rect x="60" y="100" width="102" height="44" rx="8" fill="#FFBF00" stroke="#242943" stroke-width="1"/>
    <text x="111" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#242943" text-anchor="middle">Advisory</text>
  </g>
  <g>
    <rect x="174" y="100" width="102" height="44" rx="8" fill="#FFBF00" stroke="#242943" stroke-width="1"/>
    <text x="225" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#242943" text-anchor="middle">Consulting</text>
  </g>
  <g>
    <rect x="288" y="100" width="102" height="44" rx="8" fill="#FFBF00" stroke="#242943" stroke-width="1"/>
    <text x="339" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#242943" text-anchor="middle">Product</text>
  </g>
  <g>
    <rect x="402" y="100" width="102" height="44" rx="8" fill="#FFBF00" stroke="#242943" stroke-width="1"/>
    <text x="453" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#242943" text-anchor="middle">License</text>
  </g>
  <g>
    <rect x="516" y="100" width="102" height="44" rx="8" fill="#FFBF00" stroke="#242943" stroke-width="1"/>
    <text x="567" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#242943" text-anchor="middle">Enablement</text>
  </g>
</svg>
